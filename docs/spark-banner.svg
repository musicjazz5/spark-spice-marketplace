<!-- ── LEFT PANEL ── -->

<!-- spec pills -->
<text class="g0" x="20" y="56" font-family="system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing=".08em" fill="#8B949E">DESIGN TARGET</text>
<g class="g0">
  <rect x="20"  y="62" width="72" height="16" rx="3" fill="#1C1A10" stroke="#FFA657" stroke-opacity=".4" stroke-width=".8"/>
  <text x="56"  y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="#FFA657">gain ≥60 dB</text>
