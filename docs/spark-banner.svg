  <text x="32" y="116" font-family="'Courier New',monospace" font-size="11" fill="#E6EDF3">幫我設計 60dB 50MHz Miller OTA，</text>
  <text x="32" y="134" font-family="'Courier New',monospace" font-size="11" fill="#E6EDF3">150µW power, 2pF load, razavi gm/Id 方法</text>
</g>

<!-- tool 1: explore_design_space -->
<g class="g2">
  <rect x="20" y="154" width="400" height="56" rx="5" fill="#1C2230" stroke="#30363D" stroke-width=".8"/>
  <rect x="20" y="154" width="400" height="22" rx="5" fill="#241E10"/>
