<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#FFA657"/>
  <stop offset="100%" stop-color="#3FB950"/>
</linearGradient>
<style>
.h0{opacity:0;animation:fi .4s .1s ease both}
.g0{opacity:0;animation:fi .5s .4s ease both}
.g1{opacity:0;animation:su .4s .9s ease both}
.g2{opacity:0;animation:su .4s 1.5s ease both}
.t1d{opacity:0;animation:su .4s 3.1s ease both}
.g3{opacity:0;animation:su .4s 3.4s ease both}
.t2d{opacity:0;animation:su .3s 5.7s ease both}
.g5{opacity:0;animation:su .4s 5.8s ease both}
.c1{opacity:0;animation:su .3s 5.9s ease both}
.c2{opacity:0;animation:su .3s 6.1s ease both}
.c3{opacity:0;animation:su .3s 6.3s ease both}
.c4{opacity:0;animation:su .3s 6.5s ease both}
.c5{opacity:0;animation:su .3s 6.7s ease both}
.c6{opacity:0;animation:su .3s 6.9s ease both}
.vs{opacity:0;animation:su .5s 7.2s ease both}
.ld{animation:pulse 2s ease-in-out infinite}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</defs>

<!-- background -->
<rect width="860" height="480" rx="12" fill="#0D1117"/>

<!-- header -->
<rect class="h0" x="0" y="0" width="860" height="44" rx="12" fill="#161B22"/>
<rect class="h0" x="0" y="32" width="860" height="12" fill="#161B22"/>
<rect class="h0" x="0" y="44" width="860" height="1" fill="#30363D"/>
<circle class="h0" cx="24" cy="22" r="5" fill="#FF5F57"/>
<circle class="h0" cx="40" cy="22" r="5" fill="#FFC030"/>
<circle class="h0" cx="56" cy="22" r="5" fill="#2DCA42"/>
<text class="h0" x="420" y="27" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#E6EDF3">spark-spice  ·  Miller OTA Design  ·  Claude Code</text>
<rect class="h0" x="750" y="12" width="84" height="20" rx="10" fill="#0D2218" stroke="#3FB950" stroke-opacity=".5" stroke-width="1"/>
<circle class="ld h0" cx="764" cy="22" r="4" fill="#3FB950"/>
<text class="h0" x="774" y="26" font-family="'Courier New',monospace" font-size="10" font-weight="600" fill="#3FB950">LIVE</text>

